# External Secrets, beyond "ExternalSecret is Ready":
#  1. the running version is the one declared in Git; store and every ExternalSecret are Ready
#  2. rotating the password in the vault propagates end to end: Kubernetes Secret -> PostgreSQL role
#     (CNPG managed role) -> the app opens new connections with it (and the old password stops working)
#  3. when the vault entry breaks, the ExternalSecret reports the error and keeps the last good Secret
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: external-secrets
  namespace: testkube
  labels: {demo.testkube.io/operator: external-secrets}
spec:
  use: [{name: operator-test}]
  steps:
    - name: Running version matches Git and everything is synced
      shell: |
        . /data/lib.sh
        hr_at_git_version external-secrets external-secrets EXTERNAL_SECRETS_VERSION
        kubectl get clustersecretstores,externalsecrets -A
        bad=$(kubectl get clustersecretstores,externalsecrets -A -o json | jq -r '.items[] | select(any(.status.conditions[]?; .type=="Ready" and .status=="True") | not) | "\(.kind) \(.metadata.namespace // "")/\(.metadata.name)"')
        [ -z "$bad" ] || fail "not Ready: $bad"
        ok "store and all ExternalSecrets Ready"

    - name: Password rotation propagates to PostgreSQL and the app
      shell: |
        . /data/lib.sh
        secret_pw() { kubectl -n todo get secret todo-db-credentials -o jsonpath='{.data.password}' | base64 -d; }
        old=$(secret_pw)
        new="rotated-$(date +%s)-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        echo "$new" > /data/new-password
        t0=$(date +%s)
        kubectl -n secrets-vault patch secret todo-db --type=merge -p "{\"stringData\":{\"password\":\"$new\"}}"

        synced() { [ "$(secret_pw)" = "$new" ]; }
        wait_until 90 "vault -> todo/todo-db-credentials synced" synced
        echo "   (took $(( $(date +%s) - t0 ))s)"

        rv=$(kubectl -n todo get secret todo-db-credentials -o jsonpath='{.metadata.resourceVersion}')
        role_synced() { kubectl -n todo get cluster todo-db -o json | jq -e --arg rv "$rv" '.status.managedRolesStatus.passwordStatus.todo.resourceVersion == $rv'; }
        wait_until 120 "CNPG applied the new password to role todo" role_synced

        primary=$(kubectl -n todo get cluster todo-db -o jsonpath='{.status.currentPrimary}')
        login() { kubectl -n todo exec "$primary" -c postgres -- env PGPASSWORD="$1" psql "host=localhost user=todo dbname=todo sslmode=require" -tAc 'select current_user'; }
        login "$new" >/dev/null || fail "PostgreSQL rejects the rotated password"
        if login "$old" >/dev/null 2>&1; then fail "PostgreSQL still accepts the OLD password after rotation"; fi
        ok "PostgreSQL accepts the new password and rejects the old one"

        # /healthz opens a brand-new DB connection with the credentials currently mounted in the pod.
        healthy() { for _ in 1 2 3 4 5 6; do [ "$(api -o /dev/null -w '%{http_code}' $APP/healthz)" = 200 ] || return 1; done; }
        wait_until 240 "app opens new DB connections with the rotated password" healthy
        echo "   end-to-end rotation took $(( $(date +%s) - t0 ))s"
        code=$(api -o /dev/null -w '%{http_code}' -X POST $APP/api/todos -H 'Content-Type: application/json' -d '{"title":"rotation probe"}')
        [ "$code" = 201 ] || fail "app cannot write after rotation (HTTP $code)"

    - name: A broken vault entry is reported and the last good Secret is kept
      shell: |
        . /data/lib.sh
        new=$(cat /data/new-password)
        kubectl -n secrets-vault patch secret todo-db --type=json -p '[{"op":"remove","path":"/data/password"}]'
        errored() { kubectl -n todo get externalsecret todo-db-credentials -o json | jq -e '.status.conditions[] | select(.type=="Ready") | .status=="False"'; }
        wait_until 90 "ExternalSecret reports the sync error" errored
        kubectl -n todo get externalsecret todo-db-credentials -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}'
        [ "$(kubectl -n todo get secret todo-db-credentials -o jsonpath='{.data.password}' | base64 -d)" = "$new" ] \
          || fail "the last good Secret was modified/removed while the source was broken"
        ok "last good credentials kept while the vault entry is broken"

    - name: Restore the vault entry
      condition: always
      shell: |
        . /data/lib.sh
        pw=$(cat /data/new-password 2>/dev/null || kubectl -n todo get secret todo-db-credentials -o jsonpath='{.data.password}' | base64 -d)
        kubectl -n secrets-vault patch secret todo-db --type=merge -p "{\"stringData\":{\"password\":\"$pw\"}}"
        ready() { kubectl -n todo get externalsecret todo-db-credentials -o json | jq -e '.status.conditions[] | select(.type=="Ready") | .status=="True"'; }
        wait_until 90 "ExternalSecret healthy again" ready
