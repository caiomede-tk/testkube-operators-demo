apiVersion: v1
kind: Namespace
metadata: {name: testkube}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: testkube, namespace: testkube}
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: testkube
      version: "2.14.2"
      sourceRef: {kind: HelmRepository, name: kubeshop, namespace: flux-system}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace, remediation: {retries: 2}}
