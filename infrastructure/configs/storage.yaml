# In-cluster S3 (SeaweedFS) for CNPG and Velero backups. Replace with GCS on GKE.
apiVersion: v1
kind: Namespace
metadata: {name: storage}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: seaweedfs-s3, namespace: storage}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: demo-vault}
  target:
    name: seaweedfs-s3
    template:
      data:
        s3.json: |
          {"identities":[{"name":"demo","credentials":[{"accessKey":"{{ .accessKey }}","secretKey":"{{ .secretKey }}"}],
            "actions":["Admin","Read","Write","List","Tagging"]}]}
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  dataFrom:
    - extract: {key: s3}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweedfs-data, namespace: storage}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: storage}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.00
          args: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/s3.json, -master.volumeSizeLimitMB=256]
          ports: [{containerPort: 8333, name: s3}]
          readinessProbe: {tcpSocket: {port: 8333}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/seaweedfs}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: seaweedfs-data}}
        - {name: config, secret: {secretName: seaweedfs-s3, items: [{key: s3.json, path: s3.json}]}}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: storage}
spec:
  selector: {app: seaweedfs}
  ports: [{name: s3, port: 8333}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: create-buckets, namespace: storage}
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mb
          image: amazon/aws-cli:2.31.0
          envFrom: [{secretRef: {name: seaweedfs-s3}}]
          env: [{name: AWS_DEFAULT_REGION, value: us-east-1}]
          command: [sh, -c]
          args:
            - |
              set -e
              for b in velero cnpg-backups; do
                aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $b 2>/dev/null \
                  || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$b
              done
---
# Velero's credentials file, built from the same vault entry.
apiVersion: v1
kind: Namespace
metadata: {name: velero}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: velero-s3, namespace: velero}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: demo-vault}
  target:
    name: velero-s3
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKey }}
          aws_secret_access_key={{ .secretKey }}
  dataFrom:
    - extract: {key: s3}
