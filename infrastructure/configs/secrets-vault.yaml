# Stand-in for an external secret manager (GCP Secret Manager on GKE).
# The source secrets are created once by Flux and then owned by "the vault" (IfNotPresent),
# so rotations done by tests or operators are not reverted by GitOps.
# Demo-only credentials: never put real secrets in Git.
apiVersion: v1
kind: Namespace
metadata: {name: secrets-vault}
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-db
  namespace: secrets-vault
  annotations: {kustomize.toolkit.fluxcd.io/ssa: IfNotPresent}
stringData:
  username: todo
  password: initial-Todo-pass-4f7c1a
---
apiVersion: v1
kind: Secret
metadata:
  name: s3
  namespace: secrets-vault
  annotations: {kustomize.toolkit.fluxcd.io/ssa: IfNotPresent}
stringData:
  accessKey: demo-s3-access
  secretKey: demo-s3-secret-9b2e7d
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: eso-vault-reader, namespace: secrets-vault}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: eso-vault-reader, namespace: secrets-vault}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: eso-vault-reader, namespace: secrets-vault}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-vault-reader}
subjects: [{kind: ServiceAccount, name: eso-vault-reader, namespace: secrets-vault}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: eso-vault-reader-review}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: eso-vault-reader-review}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eso-vault-reader-review}
subjects: [{kind: ServiceAccount, name: eso-vault-reader, namespace: secrets-vault}]
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: demo-vault}
spec:
  provider:
    kubernetes:
      remoteNamespace: secrets-vault
      server:
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: secrets-vault}
      auth:
        serviceAccount: {name: eso-vault-reader, namespace: secrets-vault}
