# Operators that only need CRDs/webhooks from each other. Versions come from
# clusters/kind/operator-versions.yaml through Flux post-build substitution.
apiVersion: v1
kind: Namespace
metadata: {name: cert-manager}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cert-manager, namespace: cert-manager}
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "${CERT_MANAGER_VERSION}"
      sourceRef: {kind: HelmRepository, name: jetstack, namespace: flux-system}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace, remediation: {retries: 2}}
  values:
    crds: {enabled: true}
    # Scrape endpoint pinned explicitly so the Prometheus we add on GKE finds it.
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
---
apiVersion: v1
kind: Namespace
metadata: {name: kyverno}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: kyverno, namespace: kyverno}
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "${KYVERNO_VERSION}"
      sourceRef: {kind: HelmRepository, name: kyverno, namespace: flux-system}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace, remediation: {retries: 2}}
  values:
    # Not used by the demo policies; saves CPU on a laptop-sized cluster.
    reportsController: {enabled: false}
    cleanupController: {enabled: false}
---
