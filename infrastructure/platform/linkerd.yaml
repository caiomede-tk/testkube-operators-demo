# Linkerd control plane. Its identity issuer is the cert-manager Certificate
# linkerd/linkerd-identity-issuer; the trust anchor PEM is injected from the
# cert-manager generated secret (Flux valuesFrom), so nothing is generated by hand.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: linkerd-control-plane, namespace: linkerd}
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: linkerd-control-plane
      version: "${LINKERD_VERSION}"
      sourceRef: {kind: HelmRepository, name: linkerd-edge, namespace: flux-system}
  upgrade: {remediation: {retries: 2}}
  valuesFrom:
    - kind: Secret
      name: linkerd-trust-anchor
      valuesKey: ca.crt
      targetPath: identityTrustAnchorsPEM
  values:
    identity:
      issuer:
        scheme: kubernetes.io/tls
    proxy:
      resources:
        cpu: {request: 10m}
        memory: {request: 32Mi, limit: 128Mi}
