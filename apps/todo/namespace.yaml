apiVersion: v1
kind: Namespace
metadata:
  name: todo
  labels:
    demo.testkube.io/policy: enforced   # Kyverno guardrails apply here
  annotations:
    linkerd.io/inject: enabled          # required by Kyverno policy require-mesh
---
# DB credentials come from the vault through External Secrets. CNPG uses them to create
# the owner role and keeps the role password in sync (managed roles); the app reads them from files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: todo-db-credentials, namespace: todo}
spec:
  refreshInterval: 15s
  secretStoreRef: {kind: ClusterSecretStore, name: demo-vault}
  target:
    name: todo-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
  data:
    - secretKey: username
      remoteRef: {key: todo-db, property: username}
    - secretKey: password
      remoteRef: {key: todo-db, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: s3-credentials, namespace: todo}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: demo-vault}
  target:
    name: s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKey }}"
        ACCESS_SECRET_KEY: "{{ .secretKey }}"
  dataFrom:
    - extract: {key: s3}
