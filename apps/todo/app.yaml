apiVersion: v1
kind: ServiceAccount
metadata: {name: todo, namespace: todo}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: todo-tls, namespace: todo}
spec:
  secretName: todo-tls
  dnsNames: [todo, todo.todo, todo.todo.svc, todo.todo.svc.cluster.local, localhost]
  duration: 720h
  renewBefore: 240h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {kind: ClusterIssuer, name: demo-ca}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: todo, namespace: todo}
spec:
  replicas: 2
  selector: {matchLabels: {app: todo}}
  template:
    metadata: {labels: {app: todo}}
    spec:
      serviceAccountName: todo
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: todo
          image: todo:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB_HOST, value: todo-db-rw}
            - {name: APP_VERSION, value: v1.0.0}
          ports: [{containerPort: 8443, name: https}]
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: db, mountPath: /etc/db, readOnly: true}
            - {name: tls, mountPath: /etc/tls, readOnly: true}
      volumes:
        - {name: db, secret: {secretName: todo-db-credentials}}
        - {name: tls, secret: {secretName: todo-tls}}
---
apiVersion: v1
kind: Service
metadata: {name: todo, namespace: todo}
spec:
  selector: {app: todo}
  ports: [{name: https, port: 443, targetPort: https}]
---
# Namespace-level disaster recovery. The database data itself is protected by CNPG backups.
apiVersion: velero.io/v1
kind: Schedule
metadata: {name: todo-daily, namespace: velero}
spec:
  schedule: "0 3 * * *"
  template:
    includedNamespaces: [todo]
    defaultVolumesToFsBackup: true
    ttl: 72h0m0s
