# Single source of truth for operator versions (Helm chart versions).
# Flux substitutes these into infrastructure/ HelmReleases; the TestWorkflows read this
# ConfigMap to assert that what is running is what Git asked for.
# Upgrading the operators = changing this file (see `make upgrade`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-versions
  namespace: flux-system
data:
  CERT_MANAGER_VERSION: v1.18.6          # app v1.18.6
  LINKERD_VERSION: 2026.7.2              # edge-26.7.2
  KYVERNO_VERSION: 3.6.4                 # app v1.16.4
  EXTERNAL_SECRETS_VERSION: 2.11.0       # app v2.11.0
  VELERO_VERSION: 10.1.3                 # app v1.16.2
  VELERO_AWS_PLUGIN_VERSION: v1.12.2
  CNPG_VERSION: 0.26.1                   # app v1.27.1
